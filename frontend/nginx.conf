server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo estático cai no index.html,
    # deixando o Angular Router decidir o que renderizar (sem isso, um refresh
    # em /clientes ou /ordens-servico/5 devolveria 404 do próprio nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
