spring.application.name=climaservice-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

# Origens permitidas para CORS (frontend Angular). Lista separada por vírgula.
# Configurável via variável de ambiente CORS_ALLOWED_ORIGINS em cada ambiente;
# o padrão local aponta para o servidor de desenvolvimento do Angular.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}