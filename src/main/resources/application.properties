spring.application.name=climaservice-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

# Origens permitidas para CORS (frontend Angular). Lista separada por vírgula.
# Configurável via variável de ambiente CORS_ALLOWED_ORIGINS em cada ambiente;
# o padrão local aponta para o servidor de desenvolvimento do Angular.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Ambiente usado ao criar novas notas fiscais de serviço: HOMOLOGACAO ou
# PRODUCAO. Configurável via NOTA_FISCAL_AMBIENTE.
app.nota-fiscal.ambiente=${NOTA_FISCAL_AMBIENTE:HOMOLOGACAO}

# Certificado digital A1 (arquivo PKCS#12) usado para mTLS com o Sistema
# Nacional de NFS-e (Fase 2). Ausente nesta instalação — enquanto não
# configurado, POST .../enviar continua retornando o erro explícito de
# indisponibilidade em vez de tentar uma conexão real.
app.nota-fiscal.certificado.caminho=${NOTA_FISCAL_CERTIFICADO_CAMINHO:}
app.nota-fiscal.certificado.senha=${NOTA_FISCAL_CERTIFICADO_SENHA:}

# URLs do Sefin Nacional (Sistema Nacional de NFS-e) para envio de DPS.
# Levantadas por pesquisa pública sobre o padrão nacional — confirmar contra
# o Swagger ao vivo antes de um envio real (ver README, seção NFS-e Fase 2).
app.nota-fiscal.sefin.url-homologacao=${NOTA_FISCAL_SEFIN_URL_HOMOLOGACAO:https://sefin.producaorestrita.nfse.gov.br/SefinNacional/nfse}
app.nota-fiscal.sefin.url-producao=${NOTA_FISCAL_SEFIN_URL_PRODUCAO:https://sefin.nfse.gov.br/SefinNacional/nfse}